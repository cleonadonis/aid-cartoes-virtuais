<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Cartões virtuais AID Atelier">
  <title>AID Atelier | Cartões virtuais</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <section class="profiles" aria-label="Cartões virtuais AID Atelier">
      <article class="profile">
        <h1>Inaê Pimentel</h1>
        <div class="scene">
          <div class="card" role="button" tabindex="0" aria-label="Virar cartão de Inaê Pimentel" aria-pressed="false">
            <div class="face front"><img src="assets/frente.png" alt="Frente do cartão AID Atelier"></div>
            <div class="face back">
              <img src="assets/inae-verso.png" alt="Verso do cartão de Inaê Pimentel">
              <a class="hotspot phone" href="tel:+351930456466" aria-label="Ligar para Inaê Pimentel"></a>
              <a class="hotspot instagram" href="https://www.instagram.com/aid.atelier.renovacao/" target="_blank" rel="noopener noreferrer" aria-label="Abrir Instagram da AID Atelier"></a>
              <a class="hotspot website" href="https://aidatelier.pt/" target="_blank" rel="noopener noreferrer" aria-label="Abrir site aidatelier.pt"></a>
            </div>
          </div>
        </div>
        <p class="hint">Toque no cartão para virar</p>
      </article>

      <article class="profile">
        <h1>Anderson Araújo</h1>
        <div class="scene">
          <div class="card" role="button" tabindex="0" aria-label="Virar cartão de Anderson Araújo" aria-pressed="false">
            <div class="face front"><img src="assets/frente.png" alt="Frente do cartão AID Atelier"></div>
            <div class="face back">
              <img src="assets/anderson-verso.png" alt="Verso do cartão de Anderson Araújo">
              <a class="hotspot phone" href="tel:+351968909840" aria-label="Ligar para Anderson Araújo"></a>
              <a class="hotspot instagram" href="https://www.instagram.com/aid.atelier.renovacao/" target="_blank" rel="noopener noreferrer" aria-label="Abrir Instagram da AID Atelier"></a>
              <a class="hotspot website" href="https://aidatelier.pt/" target="_blank" rel="noopener noreferrer" aria-label="Abrir site aidatelier.pt"></a>
            </div>
          </div>
        </div>
        <p class="hint">Toque no cartão para virar</p>
      </article>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
